<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Social Optimizer · powered by Grok</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c2330;
    --border: #2a3340;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #6e9fff;
    --accent2: #b083f0;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    padding: 28px 24px 8px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 26px; letter-spacing: -0.3px; }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 16px 20px 60px; }
  .composer {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
  }
  textarea {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 18px;
    margin-top: 14px;
  }
  .platforms { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 13px;
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    user-select: none;
    background: var(--panel2);
    transition: border-color .15s, background .15s;
  }
  .chip input { accent-color: var(--accent); margin: 0; }
  .chip.on { border-color: var(--accent); background: #1b2740; }
  .grow { flex: 1; }
  .toggle { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; cursor: pointer; }
  button.go {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    padding: 11px 22px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button.go:disabled { opacity: .5; cursor: not-allowed; }
  .charcount { color: var(--muted); font-size: 12px; }
  .results { margin-top: 22px; display: grid; gap: 18px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .card h2 {
    margin: 0;
    padding: 14px 18px;
    font-size: 17px;
    border-bottom: 1px solid var(--border);
    background: var(--panel2);
  }
  .card .body { padding: 16px 18px; }
  .section { margin-bottom: 20px; }
  .section:last-child { margin-bottom: 0; }
  .section h3 {
    margin: 0 0 9px;
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .scorebar {
    height: 12px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .scorebar > i { display: block; height: 100%; }
  .scoretop { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .scoretop b { font-size: 22px; }
  .drivers { list-style: none; margin: 10px 0 0; padding: 0; font-size: 14px; }
  .drivers li { padding: 2px 0; }
  .drivers li.pos::before { content: "▲ "; color: var(--green); }
  .drivers li.neg::before { content: "▼ "; color: var(--red); }
  .rewrite {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .rewrite .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .rewrite .label { font-weight: 600; color: var(--accent2); }
  .rewrite .text { white-space: pre-wrap; margin: 8px 0 6px; font-size: 14.5px; }
  .rewrite .why { color: var(--muted); font-size: 13px; font-style: italic; }
  .copy {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 7px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .copy:hover { color: var(--text); border-color: var(--accent); }
  .hooks { margin: 0; padding-left: 18px; font-size: 14.5px; }
  .hooks li { margin: 4px 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { background: #182338; color: var(--accent); border: 1px solid #243352; border-radius: 999px; padding: 4px 11px; font-size: 13px; }
  .timing b { color: var(--green); }
  .muted { color: var(--muted); }
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err { color: var(--red); font-size: 14px; }
  .loading { padding: 18px; color: var(--muted); font-size: 14px; }
  .elapsed { color: var(--accent); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>Social Optimizer</h1>
  <p>Paste a draft, pick your platforms, and let Grok tune it for the algorithm.</p>
</header>

<div class="wrap">
  <div class="composer">
    <textarea id="draft" placeholder="Paste your draft post here…"></textarea>
    <div class="row">
      <div class="platforms" id="platforms"></div>
      <div class="grow"></div>
      <label class="toggle"><input type="checkbox" id="web" /> Use live web trends (slower)</label>
    </div>
    <div class="row">
      <span class="charcount" id="charcount">0 characters</span>
      <div class="grow"></div>
      <button class="go" id="go">Optimize</button>
    </div>
  </div>

  <div class="results" id="results"></div>
</div>

<script>
const PLATFORM_FALLBACK = [
  { key: "x", name: "X (Twitter)" },
  { key: "instagram", name: "Instagram" },
  { key: "tiktok", name: "TikTok" },
];
let PLATFORMS = PLATFORM_FALLBACK;
const selected = new Set(["x", "instagram", "tiktok"]);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function loadPlatforms() {
  try {
    const r = await fetch("/api/platforms");
    if (r.ok) PLATFORMS = await r.json();
  } catch {}
  renderChips();
}

function renderChips() {
  $("platforms").innerHTML = PLATFORMS.map((p) => `
    <label class="chip ${selected.has(p.key) ? "on" : ""}" data-key="${p.key}">
      <input type="checkbox" ${selected.has(p.key) ? "checked" : ""}/> ${esc(p.name)}
    </label>`).join("");
  $("platforms").querySelectorAll(".chip").forEach((el) => {
    const cb = el.querySelector("input");
    const key = el.dataset.key;
    cb.addEventListener("change", () => {
      if (cb.checked) selected.add(key); else selected.delete(key);
      el.classList.toggle("on", cb.checked);
    });
  });
}

$("draft").addEventListener("input", (e) => {
  $("charcount").textContent = `${e.target.value.length} characters`;
});

function scoreColor(v) {
  if (v >= 70) return "var(--green)";
  if (v >= 40) return "var(--yellow)";
  return "var(--red)";
}

function cardShell(name) {
  return `<div class="card"><h2>${esc(name)}</h2>
    <div class="loading"><span class="spinner"></span> Asking Grok to optimize for ${esc(name)}…</div></div>`;
}

function renderResult(r) {
  const v = Number(r?.score?.value) || 0;
  const drivers = (r?.score?.drivers || []).map((d) => {
    const s = String(d);
    const cls = s.startsWith("+") ? "pos" : s.startsWith("-") ? "neg" : "";
    return `<li class="${cls}">${esc(s.replace(/^[+\-]\s*/, ""))}</li>`;
  }).join("");

  const rewrites = (r?.rewrites || []).map((rw) => `
    <div class="rewrite">
      <div class="head">
        <span class="label">${esc(rw.label || "Variant")}</span>
        <button class="copy" data-copy="${esc(rw.text)}">Copy</button>
      </div>
      <div class="text">${esc(rw.text)}</div>
      ${rw.why ? `<div class="why">${esc(rw.why)}</div>` : ""}
    </div>`).join("");

  const hooks = (r?.hooks || []).map((h) => `<li>${esc(h)}</li>`).join("");
  const tags = (r?.hashtags || []).map((t) => `<span class="tag">${esc(t)}</span>`).join("");

  return `
    <h2>${esc(r.platform || "Result")}</h2>
    <div class="body">
      ${r.score ? `<div class="section">
        <h3>Reach score (original draft)</h3>
        <div class="scoretop"><b style="color:${scoreColor(v)}">${v}</b><span class="muted">/ 100</span></div>
        <div class="scorebar"><i style="width:${Math.max(0, Math.min(100, v))}%;background:${scoreColor(v)}"></i></div>
        ${r.score.verdict ? `<p style="margin:8px 0 0">${esc(r.score.verdict)}</p>` : ""}
        ${drivers ? `<ul class="drivers">${drivers}</ul>` : ""}
      </div>` : ""}

      ${rewrites ? `<div class="section"><h3>Optimized rewrites</h3>${rewrites}</div>` : ""}
      ${hooks ? `<div class="section"><h3>Hook variations</h3><ul class="hooks">${hooks}</ul></div>` : ""}
      ${tags ? `<div class="section"><h3>Hashtags</h3><div class="tags">${tags}</div></div>` : ""}
      ${r.timing ? `<div class="section timing"><h3>Best time to post</h3>
        <p style="margin:0"><b>${esc(r.timing.best || "")}</b></p>
        ${r.timing.rationale ? `<p class="muted" style="margin:4px 0 0">${esc(r.timing.rationale)}</p>` : ""}
      </div>` : ""}
      ${r.notes ? `<div class="section"><h3>Notes</h3><p style="margin:0">${esc(r.notes)}</p></div>` : ""}
    </div>`;
}

async function optimizeOne(card, key, draft, web, timer) {
  try {
    const r = await fetch("/api/optimize", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ draft, platform: key, web }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
    clearInterval(timer);
    card.innerHTML = renderResult(data.result);
    card.querySelectorAll(".copy").forEach((b) =>
      b.addEventListener("click", async () => {
        await navigator.clipboard.writeText(b.dataset.copy);
        const t = b.textContent; b.textContent = "Copied!";
        setTimeout(() => (b.textContent = t), 1200);
      }));
  } catch (e) {
    clearInterval(timer);
    const name = PLATFORMS.find((p) => p.key === key)?.name || key;
    card.innerHTML = `<h2>${esc(name)}</h2><div class="body err">⚠ ${esc(e.message)}</div>`;
  }
}

$("go").addEventListener("click", async () => {
  const draft = $("draft").value.trim();
  const web = $("web").checked;
  const keys = [...selected];
  if (!draft) { $("draft").focus(); return; }
  if (!keys.length) { alert("Pick at least one platform."); return; }

  $("go").disabled = true;
  const results = $("results");
  results.innerHTML = "";
  const cards = keys.map((key) => {
    const name = PLATFORMS.find((p) => p.key === key)?.name || key;
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<h2>${esc(name)}</h2><div class="loading"><span class="spinner"></span> Asking Grok to optimize for ${esc(name)}… <span class="elapsed">0s</span></div>`;
    results.appendChild(div);
    const started = Date.now();
    const span = div.querySelector(".elapsed");
    const timer = setInterval(() => {
      if (span) span.textContent = Math.round((Date.now() - started) / 1000) + "s";
    }, 1000);
    return { key, div, timer };
  });

  await Promise.all(cards.map(({ key, div, timer }) => optimizeOne(div, key, draft, web, timer)));
  $("go").disabled = false;
});

loadPlatforms();
</script>
</body>
</html>
